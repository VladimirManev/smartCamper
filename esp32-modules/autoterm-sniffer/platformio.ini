; AUTOTERM Air 2D — stage 2 transparent bridge
; Forwards unchanged bytes between Comfort Control and Air 2D ECU.
; Do not add Wi-Fi libraries here.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DAUTOTERM_BRIDGE_TX=1

monitor_speed = 115200
monitor_echo = yes
monitor_filters =
    time
    default

upload_speed = 921600
