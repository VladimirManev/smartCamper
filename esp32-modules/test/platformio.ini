; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-zigbee]
platform = espressif32
board = ttgo-t-oi-plus
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
lib_deps = 
	mathertel/OneButton@^2.0.3
	https://github.com/Xinyuan-LilyGO/T-ZigBee.git
build_flags =
	-fpermissive

; External UART via CH340 (not USB-C CDC). Upload: unplug LilyGO USB-C from Mac.
upload_port = /dev/cu.usbserial-A5069RR4
monitor_port = /dev/cu.usbserial-A5069RR4

monitor_speed = 115200
monitor_filters =
	time
	default

upload_speed = 115200
; board_upload.before_reset = no_reset
; board_upload.after_reset = no_reset
upload_flags =
	--connect-attempts
	40

; Very slow fallback: pio run -t upload -e lilygo-t-zigbee-slow
[env:lilygo-t-zigbee-slow]
extends = env:lilygo-t-zigbee
upload_speed = 9600
platform_packages = espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
