; Scratch / experiment firmware (not production).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature

build_flags =
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
monitor_filters =
    time
    default

upload_speed = 921600
