; Scratch / experiment firmware (not production).
; Fridge + Victron live in esp32-modules/module-6.
; Ducato CAN notes: ../../CAN_SIGNALS.md
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
monitor_filters =
    time
    default

upload_speed = 921600
